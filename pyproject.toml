[project]
name = "reelsmith"
version = "0.1.0"
description = "Local pipeline that turns a short idea into a vertical video"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "structlog>=24.4",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
subtitles = ["faster-whisper>=1.1,<2", "av>=15,<17"]
check = ["numpy>=2", "scipy>=1.13", "opencv-python-headless>=4.10"]
dev = ["mypy>=1.11", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
reelsmith = "reelsmith.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reelsmith"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "RET", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF001"]
"src/reelsmith/cli.py" = ["PLR0917"]
# The example beats shown to the writer are Russian.
"src/reelsmith/beats.py" = ["RUF001"]
"scripts/make_graphs.py" = ["RUF001"]
"services/tts/design_voice.py" = ["RUF001"]
# ComfyUI calls block methods with one keyword per input, and the labels are Russian.
"comfy_nodes/*/__init__.py" = ["PLR0917", "RUF001"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
