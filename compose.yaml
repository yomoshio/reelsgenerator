name: reelsmith

# The models, on the machine with the GPU: the language models behind ollama and the speech
# service. The pipeline itself runs from a plain virtualenv and reaches them by URL.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  llm:
    <<: *gpu
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    environment:
      # The coder and the vision model take turns on every beat; both stay loaded on a big card.
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-2}"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-32768}"
      # Less memory for the same answers: flash attention, and the context cache at 8 bits.
      OLLAMA_FLASH_ATTENTION: "${OLLAMA_FLASH_ATTENTION:-1}"
      OLLAMA_KV_CACHE_TYPE: "${OLLAMA_KV_CACHE_TYPE:-q8_0}"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  speech:
    <<: *gpu
    build:
      context: .
      dockerfile: docker/speech.Dockerfile
    image: reelsmith/speech:local
    environment:
      WHISPER_COMPUTE: "${WHISPER_COMPUTE:-int8_float16}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./hf:/hf
      - ./voices:/voices
    restart: unless-stopped

  # The narrator read by Chatterbox; the pipeline uses it when REELSMITH_TTS=chatterbox.
  voice:
    <<: *gpu
    build:
      context: .
      dockerfile: docker/voice.Dockerfile
    image: reelsmith/voice:local
    environment:
      CHATTERBOX_EXAGGERATION: "${CHATTERBOX_EXAGGERATION:-0.55}"
      CHATTERBOX_CFG: "${CHATTERBOX_CFG:-0.4}"
      CHATTERBOX_TEMPERATURE: "${CHATTERBOX_TEMPERATURE:-0.75}"
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./hf:/hf
      - ./voices:/voices
    restart: unless-stopped

volumes:
  ollama:
