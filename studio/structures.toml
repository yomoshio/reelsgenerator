# Куски сюжетов из книг в общественном достоянии, разложенные по ролям. `make remix`
# собирает из них короткие идеи: мир, герой, цель, два препятствия с приёмом, который их
# побеждает, союзник с секретом, поворот и финал со скрытой новостью. Темы: space, zombie,
# survival, catastrophe, dystopia. У каждого мира есть ещё свой тег (station, moon, hunt…):
# кусок, который имеет смысл только в каком-то мире, помечается его тегом; без тегов он
# подходит к любому миру. Добавляйте свои куски: у
# каждого должен быть источник из списка.

[[sources]]
id = "wells-war"
title = "Г. Уэллс, «Война миров», 1898"
why = "Непобедимый враг, герой идёт к близкому через гибнущую страну, спасает слабость врага, которую никто не учёл."

[[sources]]
id = "wells-moon"
title = "Г. Уэллс, «Первые люди на Луне», 1901"
why = "Застряли на чужой планете, корабль потерян, отсчёт до лунной ночи, которая всех заморозит."

[[sources]]
id = "wells-star"
title = "Г. Уэллс, «Звезда», 1897"
why = "Катастрофа видна заранее и каждую ночь становится ближе: напряжение от неизбежности."

[[sources]]
id = "wells-time"
title = "Г. Уэллс, «Машина времени», 1895"
why = "Средство спасения украдено и спрятано там, куда страшнее всего идти."

[[sources]]
id = "verne-moon"
title = "Ж. Верн, «Вокруг Луны», 1870"
why = "Замкнутая капсула, воздух и тепло на счёт, промах мимо цели, расчёт вместо силы."

[[sources]]
id = "verne-island"
title = "Ж. Верн, «Таинственный остров», 1875"
why = "Выживание с нуля и невидимый помощник, который всегда успевает вовремя."

[[sources]]
id = "verne-center"
title = "Ж. Верн, «Путешествие к центру Земли», 1864"
why = "Потерялся в темноте под землёй, находит своих по эху, голос идёт сквозь камень."

[[sources]]
id = "defoe-crusoe"
title = "Д. Дефо, «Робинзон Крузо», 1719"
why = "Один против острова, а потом след чужой босой ноги на песке."

[[sources]]
id = "london-fire"
title = "Дж. Лондон, «Костёр», 1908"
why = "Мороз, последняя спичка, каждое движение на счету, собака ждёт ошибки."

[[sources]]
id = "london-life"
title = "Дж. Лондон, «Любовь к жизни», 1905"
why = "Голодный путь к морю, за героем идёт больной волк, кто ослабеет первым."

[[sources]]
id = "london-plague"
title = "Дж. Лондон, «Алая чума», 1912"
why = "Мир после мора: взрослые помнят, дети не верят, правила старого мира не работают."

[[sources]]
id = "poe-maelstrom"
title = "Э. По, «Низвержение в Мальстрем», 1841"
why = "Спасение через наблюдение в самый страшный момент: что тонет медленнее."

[[sources]]
id = "poe-pit"
title = "Э. По, «Колодец и маятник», 1842"
why = "Ловушка сжимается на глазах, спасает хладнокровная хитрость за минуту до конца."

[[sources]]
id = "poe-masque"
title = "Э. По, «Маска Красной смерти», 1842"
why = "Заперлись от мора, а смерть уже внутри, среди своих."

[[sources]]
id = "shelley-last"
title = "М. Шелли, «Последний человек», 1826"
why = "Мир пустеет по одному человеку, и каждая потеря ближе к герою."

[[sources]]
id = "doyle-belt"
title = "А. Конан Дойл, «Отравленный пояс», 1913"
why = "Комната с кислородом на одну ночь, за окном весь мир замер."

[[sources]]
id = "doyle-lost"
title = "А. Конан Дойл, «Затерянный мир», 1912"
why = "Путь назад отрезан, а вокруг то, чего не должно существовать."

[[sources]]
id = "crane-boat"
title = "С. Крейн, «Шлюпка», 1897"
why = "Берег виден, но до него не добраться: надежда, которая мучает."

[[sources]]
id = "bierce-owl"
title = "А. Бирс, «Случай на мосту через Совиный ручей», 1890"
why = "Побег, который в последней строке оказывается не тем, чем казался."

[[sources]]
id = "stoker-demeter"
title = "Б. Стокер, «Дракула», 1897, вахтенный журнал «Деметры»"
why = "Команда исчезает по одному, капитан пишет журнал до последнего дня."

[[sources]]
id = "homer-cyclops"
title = "Гомер, «Одиссея», песнь девятая"
why = "Заперты в пещере с чудовищем, выйти можно только хитростью."

[[sources]]
id = "zamyatin-we"
title = "Е. Замятин, «Мы», 1920"
why = "Герой против идеального государства, где у всех номера вместо имён."

[[sources]]
id = "connell-game"
title = "Р. Коннелл, «Самая опасная дичь», 1924"
why = "Охотник становится дичью и выживает, только думая как охотник."

[[sources]]
id = "jacobs-paw"
title = "У. Джекобс, «Обезьянья лапа», 1902"
why = "Желание исполняется, но страшнее, чем если бы не исполнилось."

# ---------------------------------------------------------------- миры
[[parts]]
kind = "world"
themes = ["space", "station"]
source = "verne-moon"
text = "На орбитальной станции «Заря-9» пробита обшивка: воздух уходит по секции в час, связь с Землёй молчит третьи сутки."

[[parts]]
kind = "world"
themes = ["space", "moon"]
source = "wells-moon"
text = "Посадочный модуль сел на ночной стороне Луны; корабль вернётся только на рассвете, через четырнадцать часов, а обогрев отказал."

[[parts]]
kind = "world"
themes = ["space", "derelict"]
source = "stoker-demeter"
text = "Грузовой корабль дрейфует к Юпитеру с заглохшим реактором; на борту было шесть человек, на вызовы отвечает один."

[[parts]]
kind = "world"
themes = ["zombie", "infected-city"]
source = "london-plague"
text = "Город на третий день заражения: заражённые днём стоят неподвижно, а ночью идут на любой звук."

[[parts]]
kind = "world"
themes = ["zombie", "hospital"]
source = "poe-masque"
text = "Карантинную больницу заперли снаружи; внутри здоровые и заражённые вперемешку, и никто не знает, кто уже болен."

[[parts]]
kind = "world"
themes = ["zombie", "train"]
source = "stoker-demeter"
text = "Ночной поезд идёт через тайгу без остановок; в последнем вагоне начали кусаться, а двери между вагонами не запираются."

[[parts]]
kind = "world"
themes = ["survival", "tundra"]
source = "london-fire"
text = "Маленький самолёт сел на лёд посреди тундры: минус пятьдесят, до станции полярников сорок километров, топлива на одну ночь."

[[parts]]
kind = "world"
themes = ["survival", "island"]
source = "defoe-crusoe"
text = "Шторм выбросил шлюпку на безымянный остров; на мокром песке свежие следы босых ног, хотя остров числится необитаемым."

[[parts]]
kind = "world"
themes = ["survival", "cave"]
source = "verne-center"
text = "Экспедицию в карстовой пещере отрезал обвал; фонарей на шесть часов, вода в нижнем зале прибывает."

[[parts]]
kind = "world"
themes = ["catastrophe", "comet"]
source = "wells-star"
text = "Астрономы объявили, что через девять дней комета пройдёт сквозь атмосферу; каждую ночь она ярче луны, и города пустеют."

[[parts]]
kind = "world"
themes = ["catastrophe", "poison"]
source = "doyle-belt"
text = "Земля прошла сквозь облако, от которого засыпает всё живое; не уснули только те, кто был в комнате с баллонами кислорода."

[[parts]]
kind = "world"
themes = ["catastrophe", "invasion"]
source = "wells-war"
text = "По долине ползёт чёрный дым и не рассеивается; кто вдохнул, не встаёт, а над дымом шагают трёхногие машины."

[[parts]]
kind = "world"
themes = ["dystopia", "wall-city"]
source = "zamyatin-we"
text = "Город за стеклянной стеной, где у каждого номер вместо имени и расписание вместо жизни; за стеной, говорят, ничего нет."

[[parts]]
kind = "world"
themes = ["dystopia", "hunt"]
source = "connell-game"
text = "Остров, куда богатые привозят людей, чтобы охотиться на них по правилам: у дичи двенадцать часов форы."

# ---------------------------------------------------------------- герои
[[parts]]
kind = "hero"
themes = ["space"]
source = "verne-moon"
text = "Героиня: бортинженер Лида, тридцать лет, рыжая коса, оранжевый комбинезон; она никогда не была главной и боится решать за других."

[[parts]]
kind = "hero"
source = "verne-island"
text = "Герой: учитель химии Андрей, сорок пять лет, очки на шнурке, серый свитер; он уверен, что знание сильнее силы, и сейчас это проверят."

[[parts]]
kind = "hero"
source = "shelley-last"
text = "Герой: бывший спасатель Марат, тридцать восемь лет, шрам через бровь, красная куртка; однажды он уже не успел и не простил себе."

[[parts]]
kind = "hero"
themes = ["infected-city", "invasion", "comet", "wall-city", "train"]
source = "london-plague"
text = "Героиня: курьер Ника, девятнадцать лет, синие кроссовки, чёрный рюкзак; она знает каждый двор в городе и никому не доверяет."

[[parts]]
kind = "hero"
themes = ["tundra", "island", "space"]
source = "crane-boat"
text = "Герой: пилот Степан, пятьдесят лет, седые усы, коричневая лётная кожанка; он привык отвечать за всех, кто у него на борту."

[[parts]]
kind = "hero"
themes = ["infected-city", "hospital", "train", "tundra", "island", "cave", "comet", "poison", "invasion", "wall-city", "hunt"]
source = "london-life"
text = "Героиня: девочка Варя, двенадцать лет, жёлтый дождевик, держит за руку младшего брата Мишу, за которого отвечает."

[[parts]]
kind = "hero"
themes = ["tundra", "island", "cave", "hunt"]
source = "london-fire"
text = "Герой: охотник Тимофей, шестьдесят лет, седая борода, ушанка, умеет выживать в тайге, но остался без ружья и без собаки."

[[parts]]
kind = "hero"
themes = ["wall-city"]
source = "zamyatin-we"
text = "Герой: номер Д-17, инженер тридцати лет в серой униформе, который впервые в жизни опоздал по расписанию."

[[parts]]
kind = "hero"
themes = ["zombie", "poison", "comet"]
source = "poe-masque"
text = "Героиня: врач Ирина, сорок лет, белый халат под пуховиком, единственная, кто понимает, как идёт болезнь."

# ---------------------------------------------------------------- цели
[[parts]]
kind = "goal"
themes = ["station", "derelict"]
source = "verne-moon"
text = "добраться до шлюзового отсека, где стоит спасательная капсула."

[[parts]]
kind = "goal"
themes = ["moon", "station"]
source = "wells-moon"
text = "дотянуть до рассвета и подать сигнал кораблю, пока не кончился кислород."

[[parts]]
kind = "goal"
themes = ["island", "tundra", "invasion", "poison", "hunt", "infected-city", "comet", "cave"]
source = "verne-island"
text = "дойти до радиовышки на холме и сказать миру, что здесь есть живые."

[[parts]]
kind = "goal"
themes = ["infected-city", "invasion", "comet", "poison", "wall-city", "hospital", "train"]
source = "wells-war"
text = "найти сестру, которая была в другом конце города, когда всё началось."

[[parts]]
kind = "goal"
themes = ["tundra"]
source = "london-fire"
text = "дойти до станции полярников раньше, чем сядет солнце."

[[parts]]
kind = "goal"
themes = ["island", "tundra"]
source = "defoe-crusoe"
text = "развести огонь, построить укрытие и пережить первую ночь."

[[parts]]
kind = "goal"
themes = ["infected-city", "invasion", "comet", "poison"]
source = "shelley-last"
text = "вывести людей к порту, откуда утром уходит последний корабль."

[[parts]]
kind = "goal"
themes = ["wall-city"]
source = "zamyatin-we"
text = "пробраться за стену и увидеть, что там на самом деле."

[[parts]]
kind = "goal"
themes = ["hunt"]
source = "connell-game"
text = "продержаться до полудня, когда по правилам охота заканчивается."

[[parts]]
kind = "goal"
themes = ["infected-city", "hospital"]
source = "london-plague"
text = "достать сыворотку из лаборатории на минус третьем этаже."

# ---------------------------------------------------------------- препятствия
[[parts]]
kind = "obstacle"
themes = ["tundra"]
source = "london-fire"
text = "между героем и берегом трещина во льду; он ложится плашмя и ползёт, распределив вес."

[[parts]]
kind = "obstacle"
themes = ["tundra", "island", "cave"]
source = "london-fire"
text = "последняя спичка гаснет на ветру, и тогда огонь разводят из трутовика, который всю дорогу сушился у героя под шапкой."

[[parts]]
kind = "obstacle"
themes = ["island", "cave", "invasion"]
source = "poe-maelstrom"
text = "водоворот затягивает лодку; герой замечает, что круглые бочки тонут медленнее обломков, и привязывает себя к бочке."

[[parts]]
kind = "obstacle"
themes = ["hunt", "wall-city", "infected-city", "hospital", "island"]
source = "poe-pit"
text = "героя связали в тёмной комнате, и пол медленно наклоняется к яме; он мажет верёвки остатками еды, и крысы перегрызают их за минуту до конца."

[[parts]]
kind = "obstacle"
themes = ["cave", "island", "hunt", "derelict"]
source = "homer-cyclops"
text = "чудовище держит людей в пещере и выпускает только стадо; герой цепляется под брюхо самого крупного зверя и выходит вместе с ним."

[[parts]]
kind = "obstacle"
themes = ["tundra", "island"]
source = "london-life"
text = "сил почти не осталось, а за героем след в след идёт больной волк и ждёт, кто ослабеет первым."

[[parts]]
kind = "obstacle"
themes = ["cave", "hospital", "derelict", "station"]
source = "verne-center"
text = "фонарь гаснет в лабиринте; герой кричит и идёт туда, откуда эхо возвращается дважды, потому что там второй выход."

[[parts]]
kind = "obstacle"
themes = ["station", "moon", "derelict"]
source = "verne-moon"
text = "кислорода остаётся на сорок минут на двоих; героиня гасит всё, даже свет, и вслух считает вдохи."

[[parts]]
kind = "obstacle"
themes = ["station", "derelict"]
source = "verne-moon"
text = "магнитные ботинки отказывают, героя уносит от корпуса; он бросает инструменты в обратную сторону, и отдача возвращает его к корпусу."

[[parts]]
kind = "obstacle"
themes = ["infected-city", "train", "hospital"]
source = "london-plague"
text = "заражённые идут на звук; герой заводит будильник в соседнем дворе и проходит, пока толпа поворачивается к звонку."

[[parts]]
kind = "obstacle"
themes = ["infected-city", "hospital"]
source = "poe-masque"
text = "лестницу перекрыла толпа заражённых; герой поднимается по шахте лифта, на ощупь считая этажи по двери каждого."

[[parts]]
kind = "obstacle"
themes = ["invasion"]
source = "wells-war"
text = "луч машины выжигает дорогу; герой идёт по дну канавы с водой, где луч его не достаёт."

[[parts]]
kind = "obstacle"
themes = ["invasion"]
source = "wells-war"
text = "дым тяжелее воздуха и стелется по низинам, поэтому герой уходит на крыши и идёт по ним."

[[parts]]
kind = "obstacle"
themes = ["hunt"]
source = "connell-game"
text = "охотники идут по следу; герой оставляет след в болото и возвращается по нему же задом наперёд."

[[parts]]
kind = "obstacle"
themes = ["wall-city"]
source = "zamyatin-we"
text = "камеры видят каждого, кто идёт не по расписанию; герой встаёт в общий строй и идёт в ногу до самой стены."

[[parts]]
kind = "obstacle"
themes = ["island", "hunt", "tundra"]
source = "doyle-lost"
text = "единственный мост через ущелье сброшен; герой валит сухую сосну поперёк пропасти и идёт по стволу."

[[parts]]
kind = "obstacle"
themes = ["island"]
source = "crane-boat"
text = "берег виден, но прибой разобьёт лодку; герой считает волны и гребёт после седьмой, за которой бывает затишье."

[[parts]]
kind = "obstacle"
themes = ["infected-city", "hospital", "train", "comet", "poison", "invasion", "wall-city"]
source = "shelley-last"
text = "людей в убежище больше, чем еды; герой делит всё поровну, отдаёт свою долю ребёнку, и вечером взрослые начинают шептаться."

[[parts]]
kind = "obstacle"
themes = ["poison"]
source = "doyle-belt"
text = "кислорода в комнате до утра на троих, а за дверью стучит четвёртый."

[[parts]]
kind = "obstacle"
themes = ["moon"]
source = "wells-moon"
text = "к рассвету грунт оттаивает и вокруг вырастает чужая трава выше головы, модуль теряется из виду; героиня втыкает фонари по пути, чтобы найти дорогу назад."

[[parts]]
kind = "obstacle"
themes = ["moon"]
source = "wells-moon"
text = "впереди расщелина шире автобуса; при лунной тяжести герой разбегается и перелетает её, но обратно с грузом так уже не прыгнуть."

[[parts]]
kind = "obstacle"
themes = ["comet"]
source = "wells-star"
text = "на трассах стоят пробки на сотни километров, все бегут от побережья; герой идёт пешком по железнодорожной насыпи, где машин нет."

[[parts]]
kind = "obstacle"
themes = ["comet"]
source = "wells-star"
text = "от жара кометы тает лёд на реке, и брод, по которому прошли все, уходит под воду; герой переправляется по опорам старого моста."

# ---------------------------------------------------------------- союзники
[[parts]]
kind = "ally"
themes = ["station", "derelict", "moon"]
source = "stoker-demeter"
text = "По пути герой встречает механика Глеба: тот знает станцию наизусть, но молчит, почему один уцелел в своей секции."

[[parts]]
kind = "ally"
themes = ["infected-city", "hospital", "train", "invasion"]
source = "london-plague"
text = "По пути встречается девочка с рыжей собакой: собака рычит на заражённых раньше, чем их видно."

[[parts]]
kind = "ally"
themes = ["infected-city", "hospital", "train", "tundra", "island", "cave", "comet", "poison", "invasion", "wall-city", "hunt"]
source = "verne-island"
text = "По пути встречается старик-радиолюбитель: он годами слушал эфир и слышал позывной, которого нет ни в одном справочнике."

[[parts]]
kind = "ally"
source = "verne-island"
text = "Кто-то незнакомый всякий раз оказывается рядом в нужную минуту, но ни разу не показывает лица."

[[parts]]
kind = "ally"
themes = ["poison"]
source = "doyle-belt"
text = "Соседка из комнаты напротив приносит второй баллон кислорода и не говорит, откуда он у неё."

[[parts]]
kind = "ally"
themes = ["wall-city"]
source = "zamyatin-we"
text = "Охранник в серой форме предлагает показать дорогу к стене и знает о герое слишком много."

[[parts]]
kind = "ally"
themes = ["hunt", "island", "tundra", "cave"]
source = "connell-game"
text = "По пути встречается раненый проводник: он знает остров, но хромает, и с ним вдвое медленнее."

[[parts]]
kind = "ally"
themes = ["tundra", "island"]
source = "london-fire"
text = "Рядом идёт чужая собака: она держится на шаг позади и смотрит, когда человек ошибётся."

# ---------------------------------------------------------------- повороты
[[parts]]
kind = "twist"
source = "wells-time"
text = "на полпути выясняется, что цель уже занята: там кто-то живёт и не рад гостям."

[[parts]]
kind = "twist"
source = "jacobs-paw"
text = "союзник оказывается тем, из-за кого всё случилось."

[[parts]]
kind = "twist"
source = "shelley-last"
text = "сигнал, на который они шли, записан на плёнку и крутится по кругу уже несколько лет."

[[parts]]
kind = "twist"
themes = ["island", "tundra"]
source = "defoe-crusoe"
text = "один из следов на песке совпадает с подошвой героя: кто-то ходит в его ботинках."

[[parts]]
kind = "twist"
themes = ["derelict", "train"]
source = "stoker-demeter"
text = "капитан вёл журнал до последнего дня, и последняя запись сделана сегодня утром."

[[parts]]
kind = "twist"
themes = ["zombie"]
source = "london-plague"
text = "болезнь не трогает детей, и взрослые начинают их бояться."

[[parts]]
kind = "twist"
themes = ["wall-city"]
source = "zamyatin-we"
text = "за стеной есть ещё одна стена, и номер героя написан на ней снаружи."

[[parts]]
kind = "twist"
source = "bierce-owl"
text = "побег удаётся слишком легко, и герой понимает, что его выпустили нарочно."

[[parts]]
kind = "twist"
themes = ["invasion"]
source = "wells-war"
text = "враг вдруг слабеет сам, от того, чего он не ожидал встретить на этой планете."

[[parts]]
kind = "twist"
themes = ["station", "moon", "derelict"]
source = "wells-time"
text = "часы героя идут иначе, чем у всех остальных на борту."

# ---------------------------------------------------------------- финалы
[[parts]]
kind = "ending"
themes = ["tundra"]
source = "defoe-crusoe"
text = "на снегу рядом с его следами появляются ещё одни, хотя он шёл один."

[[parts]]
kind = "ending"
source = "jacobs-paw"
text = "рация отвечает голосом героя, записанным час назад."

[[parts]]
kind = "ending"
themes = ["station", "derelict"]
source = "verne-moon"
text = "спасательная капсула рассчитана на двоих, а живых трое."

[[parts]]
kind = "ending"
themes = ["hospital", "infected-city"]
source = "poe-masque"
text = "по радио объявляют, что карантин сняли неделю назад, а двери снаружи кто-то запер сегодня утром."

[[parts]]
kind = "ending"
themes = ["comet"]
source = "wells-star"
text = "комета проходит, и наступает тишина: птицы больше не поют, и это только начало."

[[parts]]
kind = "ending"
themes = ["zombie"]
source = "bierce-owl"
text = "герой спокойно смотрит на укус на руке: он не болит уже третий день."

[[parts]]
kind = "ending"
themes = ["hunt"]
source = "connell-game"
text = "хозяин острова поднимает бокал за дичь, которая впервые ушла, и включает экран: на нём дом героя."

[[parts]]
kind = "ending"
themes = ["wall-city"]
source = "zamyatin-we"
text = "у союзника под рукавом тот же номер, что у героя, только с другим годом."

[[parts]]
kind = "ending"
themes = ["derelict", "train"]
source = "stoker-demeter"
text = "последняя запись в журнале обрывается на слове «он за штурвалом»."

[[parts]]
kind = "ending"
themes = ["island"]
source = "crane-boat"
text = "бутылка, которую герой бросил в море в первый день, возвращается на берег с ответом внутри."

[[parts]]
kind = "ending"
themes = ["moon"]
source = "wells-moon"
text = "корабль наконец отвечает и спрашивает, кто третий в модуле."
