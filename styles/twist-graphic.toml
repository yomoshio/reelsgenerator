about = "Classic short stories with a turn at the end, retold faithfully on serious, minimal graphic novel art with hard light, 60 to 90 seconds an episode; a story takes as many episodes as its own parts."

[story]
shots = [14, 20]
seconds = [60, 90]
beats = [8, 10]
words = 22
empty_shots = 1
moving = 0.4
brief = """
You retell one episode of a classic short story. The idea gives the story beat by beat:
keep its events, their order, its people and its ending, and add nothing the author did
not write. Your job is to tell that story so that a viewer about to scroll away stays to
the last word and leaves with its point.

The story is one thread. One hero the viewer follows from the first shot to the last, in a
few places that stay the same, every moment caused by the one before. The viewer always
knows where they are, who this is and what they want, and never sees anything the story
does not need.

Every numbered beat of the idea is told, in the idea's order, and none is merged away or
skipped: the beat where a wish is made, a lie is told or a thing is lost is the one the
ending needs. The idea's last phrase is the last line, kept as it is.

Every person the idea gives a look, and every group such as three hunters or the
soldiers, is a character, with that look copied word for word. A look is age, hair, face,
clothes and shoes, never a thing in the hands or an action: the look is drawn into every
frame with that person, so a mirror in it would be in every frame. A shot's `cast` names
everyone visible in its picture; a shot with people in it never has an empty cast.

The painter sees nothing but one picture at a time. Every picture names people in English
as the looks do and says plainly what the eye sees: "raw, chapped hands", never a figure
of speech the painter could take literally. The period and the place come from the
place's look, which is added to every picture set there.

Opening. The first sentence drops the listener into the strangest or most dangerous moment
of the story, or asks the question the story answers, in at most ten words, before any
name. Weather is never a hook. The next sentences say who, where, and what they want or
fear. An episode that continues an earlier one opens instead with one sentence that says
where the story stopped, then goes straight on.

Middle. Every few sentences something changes: a new fact, a decision, a sound, a person
at the door, each caused by what came before and each raising the stakes. After each turn
let it land: what the hero feels, one detail they notice. The idea names the detail the
ending depends on; show it early and name it plainly, so the viewer remembers it without
being told why it matters.

Ending. In a story's last episode the last lines bring that detail back and turn the
meaning of everything before it; the very last line is a statement that leaves the
premise in the viewer's head. In an episode that continues, end on the moment of the
highest suspense. Either way end on a statement, not a question.

Voice: a storyteller telling a friend a story they know by heart, in the present tense and
plain living words. Tension builds toward each turn: sentences get short and quick in
action and slow down before a reveal. Say what the hero feels when it matters, simply,
such as «ей стыдно» or «он не верит своим ушам», never with a pile of adjectives. Plain
spoken word order, no rhyme, no poetic turns, nothing said twice.

Plates only where they help: a `card` the first time a person appears, and a `count` only
where the story keeps a count of its own, such as wishes left, nights or money owed. Say
the number aloud first, then show it, and change it only for a reason the viewer saw. No
`goal` plate unless the story names a place to reach.

The hero is in the frame in most shots. The first time the story enters a place, show it
in a wide shot with the hero inside it, so the viewer knows where they are; closer shots
follow in the same place. A scene holds for several sentences: where the action goes on,
the next shot `continues` it, so the viewer follows one take instead of a slideshow. The
world only changes for a reason the viewer saw.

Suspense over gore: no blood, wounds or bodies on screen; a death is told, or shown by
what the others see on a face.

The music is quiet and tense, low strings or a sparse piano over a drone, no beat.
"""
critic = """
Does the script cut the outline's narration into shots word for word, one moment per
shot? Does every shot name one of the outline's places, and is the first shot in each place
a wide shot with the hero in it? Do shots where the action goes on in the same place
`continue` the one before, so scenes hold instead of jumping? Is every person and group
the idea describes among the characters, and does every shot with people list them in its
cast? Is the hero in the frame in most shots, and does every picture show one place and
one moment, exactly what its line says?
"""

[look]
frame = """
serious graphic novel art printed full bleed to every edge, no border, no panel frame,
large flat areas of solid black, sharp angular shapes, minimal composition with wide
negative space, fine precise linework only in the lit areas, limited palette of black,
bone white and one muted red, the characters' signature colours kept muted, hard light
from one side, adult realistic proportions, small heads, natural eyes, serious faces,
eye-level camera inside the scene with clear depth, vertical 9:16, no speech bubbles,
no captions, nothing written anywhere, no text, no letters, no numbers, no signs
"""
motion = "subtle animation of a graphic novel panel, the flat black shapes, lines and colours stay exactly as drawn, the light flickers gently, smoke and liquids move slowly, still camera or a very slow push-in"
judge = """
The pictures are serious graphic novel panels: large flat black areas, hard light from
one side, fine lines only where the light falls, a few muted colours, printed to the
edges. People have adult proportions and clear, serious faces, and each one matches their
look in every shot: same hair, clothes and signature colour. A cartoonish face with big
eyes, a hidden or blank face, a person who is not in the cast, a figure or creature nobody
asked for, a view in cross-section or from above, a picture inside a window that shows a
second scene, a white border or panel frame, speech bubbles, any lettering or numerals
inside the picture are defects, and so is anything that looks like a photograph.
"""

