about = "Dry comic everyday story that looks shot on a friend's phone: one tired hero, small troubles that grow absurd, a straight-faced storyteller, 45 to 75 seconds."
voice = "deadpan"

[story]
shots = [12, 18]
seconds = [45, 75]
beats = [8, 10]
words = 20
empty_shots = 1
moving = 0.4
brief = """
You tell a dry comic story about one ordinary tired man and a small everyday trouble that
grows absurd. The idea gives the events in order; keep them, their numbers and their
people, and add nothing that explains the joke.

The story is one thread: the same man in two or three ordinary places that stay the same,
each trouble caused by the one before, so the viewer follows him like a friend telling
what happened to him yesterday. Things stand where they would in life: the cash machine
he argues with is the one in the shop where the cashier shrugs, never one out in the
street.

Opening. The first sentence is the most absurd moment of the story, said flatly, such as
«Иван кричит на банкомат», before anything is explained. Then go back and tell how it came
to this.

Middle. Each new trouble is a little worse than the last and follows from it. Comic timing:
a plain setup, a beat of silence «…», then the fact that makes it absurd. The hero's
reaction is small and tired: a sigh, a look, one dry line he says to the camera, quoted as
he says it.

Ending. The last line is the dry punchline that turns the whole trouble around, said as
calmly as everything else, with no moral and no summary after it.

Voice: a dry ironic storyteller with a straight face, present tense, living spoken
Russian: short and longer sentences, small observations, a pause before each punchline.
The humour comes from the facts and the hero's stone face; never laugh at your own joke,
never explain it. A number the idea gives is said aloud and shown on a `stat` plate in the
same shot.

Every picture says plainly what the eye sees. A phone or a cash machine screen is seen
from the side or as a glowing blank rectangle, never readable. Close-ups of hands, faces
and a phone held in the hand alternate with wider views of the same kitchen, courtyard or
shop; where the action goes on, the next shot `continues` it.
"""
critic = """
Does the script cut the outline's narration into shots word for word, one moment per
shot? Does every shot name one of the outline's places, and do the things the story uses
stand where they would in life, the same in every shot? Is every number said aloud on the
shot whose `stat` plate shows it? Does every picture show one action in one ordinary
place, with screens unreadable? Does it end on the punchline without a moral?
"""

[look]
frame = """
vertical 9:16 photo taken on a cheap smartphone by a friend, harsh overexposed highlights,
yellow-green fluorescent and sodium street light, light digital noise, no colour grading,
no bokeh, everything in focus, slightly tilted handheld framing, ordinary post-Soviet
apartment, courtyard or supermarket, real everyday clutter, natural skin with pores and
stubble, phone and machine screens glow as blank rectangles, no text, no letters, no
numbers, no logos, no signs
"""
motion = "handheld phone footage, the camera shakes slightly and holds on the subject, people move at normal speed"
judge = """
The pictures look like casual smartphone photos: overexposed, yellow-green artificial
light, noise, tilted handheld framing, an ordinary Russian kitchen, courtyard or shop.
People look real and tired, and the hero matches his look in every shot: same face,
stubble, slicked hair, wrinkled T-shirt, track pants and sneakers. Cinematic lighting,
bokeh, glossy skin, an illustration or cartoon, readable text on a screen, logos and
lettering are defects.
"""

[captions]
font = "Montserrat ExtraBold"
size = 118
margin_v = 760
words = 2
spoken = "FFFFFF"
accent = "FFFFFF"
outline = "000000"
outline_px = 9
karaoke = false

[overlays.stat]
